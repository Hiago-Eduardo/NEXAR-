<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Sem estas linhas o navegador pedia /favicon.ico por conta própria,
         levava 404 em TODA página e sujava o console -- foi assim que o
         problema apareceu, num teste que falha quando a página loga erro
         (seção 107). A aba também ficava sem ícone nenhum. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F94F0C" />

    <!-- Tipografia NEXAR: Archivo (grotesco robusto, eixo de peso 400-900) para
         texto e títulos; IBM Plex Mono para dados, códigos e microrrótulos.
         O pareamento grotesco + mono é o que dá a leitura de catálogo técnico.
         Ver CONTEXTO.MD/Resumo.md seção 71. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>NEXAR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
